<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>CementoTrazabilidad - Sistema de Gestión de Producción</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Estilos personalizados -->
    <link href="css/app.css" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        /* Ocultar el mensaje de error por defecto */
        #blazor-error-ui {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-3">Inicializando sistema...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        <div class="alert alert-danger">
            <div class="container">
                <h4>Error</h4>
                <p>Ha ocurrido un error en la aplicación.</p>
                <div class="mt-2">
                    <a href="" class="btn btn-primary btn-sm">Recargar</a>
                    <a class="btn btn-secondary btn-sm dismiss">Cerrar</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- charts.js -->
    <script src="js/charts.js"></script>

    <!-- Blazor Framework -->
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        // ✅ Esperar a que Blazor esté completamente cargado
        window.addEventListener('load', () => {
            const errorUi = document.getElementById('blazor-error-ui');
            const dismissButton = errorUi?.querySelector('.dismiss');

            if (dismissButton) {
                dismissButton.addEventListener('click', () => {
                    errorUi.style.display = 'none';
                });
            }

            console.log('🔍 Verificando funciones JavaScript...');
            console.log('limpiarGraficos:', typeof window.limpiarGraficos);
            console.log('renderizarGraficoDistribucion:', typeof window.renderizarGraficoDistribucion);
            console.log('renderizarGraficoParadasDetalladas:', typeof window.renderizarGraficoParadasDetalladas);
            console.log('renderizarGraficoComparacion:', typeof window.renderizarGraficoComparacion);
            console.log('descargarExcelConToken:', typeof window.descargarExcelConToken);
        });

        // ============================================
        // 📁 FUNCIONES DE DESCARGA
        // ============================================

        // Función para descargar archivos (existente)
        window.descargarArchivo = function (nombreArchivo, tipoContenido, datos) {
            const blob = new Blob([new Uint8Array(datos)], { type: tipoContenido });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = nombreArchivo;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(link.href);
        };

        // ✅ NUEVA: Descargar Excel con token de autenticación
        window.descargarExcelConToken = async function (url, token) {
            try {
                console.log('📥 Descargando Excel con token...');

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    alert('⚠️ No tiene permisos para descargar este reporte. Solo Administradores y Supervisores.');
                    return;
                }

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                const blob = await response.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);

                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = 'reporte.xlsx';
                if (contentDisposition) {
                    const match = contentDisposition.match(/filename="(.+)"/);
                    if (match) filename = match[1];
                }

                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);

                console.log('✅ Excel descargado correctamente:', filename);
            } catch (error) {
                console.error('❌ Error al descargar:', error);
                alert(`Error al descargar: ${error.message}`);
            }
        };
    </script>
</body>
</html>
